<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>软件交付实时监控</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #020a14;
    --bg-2: #031526;
    --panel: rgba(5, 22, 38, 0.82);
    --line: rgba(57, 230, 255, 0.18);
    --line-strong: rgba(57, 230, 255, 0.45);
    --text: #d9f7ff;
    --muted: #6f9db4;
    --cyan: #39e6ff;
    --blue: #2f7bff;
    --green: #3bf5a0;
    --yellow: #ffd34d;
    --red: #ff5c7a;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    --sans: "PingFang SC", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1000px 600px at 50% -10%, rgba(47, 123, 255, 0.18), transparent 60%),
      radial-gradient(800px 500px at 100% 100%, rgba(57, 230, 255, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(57, 230, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57, 230, 255, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 35%, #000 0%, transparent 78%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.18;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px);
  }
  .shell { position: relative; max-width: 1500px; margin: 0 auto; padding: 22px 22px 30px; }
  header {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 18px;
    padding: 8px 4px 16px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .sigil {
    width: 38px; height: 38px; border: 1px solid var(--cyan); border-radius: 9px;
    position: relative; box-shadow: 0 0 24px rgba(57, 230, 255, 0.28), inset 0 0 18px rgba(57, 230, 255, 0.18);
  }
  .sigil::before, .sigil::after {
    content: ""; position: absolute; inset: 7px; border: 1px solid rgba(57, 230, 255, 0.55); border-radius: 5px;
    transform: rotate(45deg);
  }
  .sigil::after { inset: 14px; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  h1 { margin: 0; font-size: 20px; letter-spacing: 0.18em; font-weight: 700; }
  .sub { margin-top: 5px; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; }
  .hud-right { display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .live { display: flex; align-items: center; gap: 8px; color: var(--green); letter-spacing: 0.12em; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  .live.off { color: var(--red); }
  .live.off .live-dot { background: var(--red); box-shadow: 0 0 10px var(--red); }
  .layout { display: grid; grid-template-columns: 248px minmax(0, 1fr) 340px; gap: 14px; margin-top: 14px; }
  .panel {
    position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px; backdrop-filter: blur(6px);
    box-shadow: inset 0 0 40px rgba(57, 230, 255, 0.025);
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 12px; height: 12px; border-color: var(--cyan); border-style: solid;
  }
  .panel::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
  .panel::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
  .eyebrow { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 12px; }
  .chips { display: flex; flex-direction: column; gap: 8px; }
  .chip { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; }
  .chip .k { color: var(--muted); letter-spacing: 0.1em; }
  .chip .v { color: var(--cyan); text-shadow: 0 0 12px rgba(57, 230, 255, 0.4); }
  .gate-strip { display: flex; gap: 4px; margin-top: 14px; flex-wrap: wrap; }
  .gate {
    flex: 1 0 22%; text-align: center; font-family: var(--mono); font-size: 8px; padding: 4px 0;
    border: 1px solid var(--line); color: var(--muted); border-radius: 3px;
  }
  .gate.past { color: var(--cyan); border-color: rgba(57, 230, 255, 0.3); }
  .gate.on { color: #04121c; background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 14px rgba(57, 230, 255, 0.55); font-weight: 700; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 5px; padding: 10px 9px; background: rgba(2, 12, 22, 0.55); }
  .stat .num { font-family: var(--mono); font-size: 24px; font-weight: 700; line-height: 1; }
  .stat .name { font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; color: var(--muted); margin-top: 6px; }
  .stat.active .num { color: var(--green); text-shadow: 0 0 16px rgba(59, 245, 160, 0.45); }
  .stat.blocked .num { color: var(--red); text-shadow: 0 0 16px rgba(255, 92, 122, 0.45); }
  .stat.handoffs .num { color: var(--yellow); text-shadow: 0 0 16px rgba(255, 211, 77, 0.4); }
  .stage {
    position: relative; min-height: 620px; overflow: hidden; padding: 0;
    background:
      radial-gradient(520px 300px at 50% 50%, rgba(47, 123, 255, 0.16), transparent 70%),
      linear-gradient(180deg, rgba(4, 20, 36, 0.9), rgba(2, 8, 16, 0.95));
  }
  .stage::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(57, 230, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57, 230, 255, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(600px) rotateX(58deg) scale(1.7);
    transform-origin: 50% 65%;
    opacity: 0.55;
    mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 72%);
  }
  .stage-head {
    position: absolute; left: 18px; top: 16px; right: 18px; display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; color: var(--muted); z-index: 5;
  }
  .stage-head .accent { color: var(--cyan); }
  .links { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  .node {
    position: absolute; z-index: 3; width: 118px; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none;
  }
  .disc {
    position: relative; width: 58px; height: 58px; margin: 0 auto; border-radius: 50%;
    border: 1px solid rgba(57, 230, 255, 0.55);
    background: radial-gradient(circle at 50% 38%, rgba(57, 230, 255, 0.32), rgba(3, 18, 32, 0.95) 62%);
    box-shadow: 0 0 20px rgba(57, 230, 255, 0.18), inset 0 0 18px rgba(57, 230, 255, 0.18);
    display: flex; align-items: center; justify-content: center;
  }
  .disc::before {
    content: ""; position: absolute; inset: -7px; border-radius: 50%;
    border: 1px dashed rgba(57, 230, 255, 0.22);
  }
  .disc::after {
    content: ""; position: absolute; inset: 8px; border-radius: 50%;
    border: 1px solid rgba(57, 230, 255, 0.35);
  }
  .glyph { font-family: var(--mono); font-size: 13px; color: var(--cyan); letter-spacing: 0.05em; text-shadow: 0 0 10px rgba(57, 230, 255, 0.7); z-index: 2; }
  .node.core { width: 150px; }
  .node.core .disc {
    width: 92px; height: 92px; border-color: var(--cyan);
    box-shadow: 0 0 46px rgba(57, 230, 255, 0.38), inset 0 0 26px rgba(57, 230, 255, 0.25);
  }
  .node.core .glyph { font-size: 16px; }
  .label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; margin-top: 7px; color: var(--text); white-space: nowrap; }
  .task { font-size: 9px; color: var(--muted); margin-top: 3px; line-height: 1.35; max-height: 25px; overflow: hidden; }
  .dot { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .node.working .disc { border-color: var(--green); box-shadow: 0 0 30px rgba(59, 245, 160, 0.4), inset 0 0 22px rgba(59, 245, 160, 0.2); }
  .node.working .glyph { color: var(--green); text-shadow: 0 0 10px rgba(59, 245, 160, 0.7); }
  .node.working .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .node.waiting .disc { border-color: var(--yellow); box-shadow: 0 0 26px rgba(255, 211, 77, 0.32); }
  .node.waiting .dot { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }
  .node.blocked .disc { border-color: var(--red); box-shadow: 0 0 30px rgba(255, 92, 122, 0.4); }
  .node.blocked .glyph { color: var(--red); }
  .node.blocked .dot { background: var(--red); box-shadow: 0 0 10px var(--red); }
  .node.idle { opacity: 0.62; }
  .legend { position: absolute; left: 18px; bottom: 14px; display: flex; gap: 16px; font-family: var(--mono); font-size: 8px; color: var(--muted); z-index: 5; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 18px; height: 0; border-top: 1px dashed var(--yellow); display: inline-block; }
  .legend .idle-line { border-top: 1px solid rgba(57, 230, 255, 0.35); }
  .log { display: flex; flex-direction: column; gap: 8px; max-height: 610px; overflow: auto; padding-right: 2px; }
  .flow {
    position: relative; border: 1px solid var(--line); border-left: 2px solid var(--yellow);
    background: rgba(2, 12, 22, 0.6); border-radius: 4px; padding: 9px 10px;
  }
  .flow .top { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; flex-wrap: wrap; }
  .flow .from { color: var(--blue); }
  .flow .to { color: var(--green); }
  .flow .arrow { color: var(--yellow); }
  .flow .time { margin-left: auto; color: var(--muted); font-size: 8px; }
  .flow .bottom { display: flex; gap: 6px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
  .flow .artifact { font-family: var(--mono); font-size: 8px; color: var(--muted); word-break: break-all; }
  .pill { font-family: var(--mono); font-size: 8px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
  .pill.in-review { color: var(--yellow); border-color: rgba(255, 211, 77, 0.35); }
  .pill.done { color: var(--green); border-color: rgba(59, 245, 160, 0.35); }
  .empty { color: var(--muted); font-family: var(--mono); font-size: 10px; line-height: 1.8; padding: 10px 2px; }
  .empty.events-error { color: var(--yellow); overflow-wrap: anywhere; }
  .empty code { color: var(--cyan); background: rgba(57, 230, 255, 0.08); padding: 1px 5px; border-radius: 3px; }
  footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; color: var(--muted); font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em; flex-wrap: wrap; }
  @media (max-width: 1200px) { .layout { grid-template-columns: 220px minmax(0, 1fr); } .log-panel { grid-column: 1 / -1; } .log { max-height: 260px; } }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .stage { min-height: 560px; }
    .node { width: 88px; }
    .disc { width: 44px; height: 44px; }
    .node.core .disc { width: 72px; height: 72px; }
    .glyph { font-size: 10px; }
    .label { font-size: 8px; }
    .task { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .node.working .disc { animation: pulse 2.2s ease-in-out infinite; }
    .node.core .disc { animation: corePulse 3s ease-in-out infinite; }
    .live-dot { animation: blink 1.4s ease-in-out infinite; }
    .flow-path { animation: dash 1.1s linear infinite; }
  }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 18px rgba(59, 245, 160, 0.2), inset 0 0 18px rgba(59, 245, 160, 0.15); } 50% { box-shadow: 0 0 34px rgba(59, 245, 160, 0.5), inset 0 0 24px rgba(59, 245, 160, 0.3); } }
  @keyframes corePulse { 0%, 100% { box-shadow: 0 0 38px rgba(57, 230, 255, 0.25), inset 0 0 24px rgba(57, 230, 255, 0.2); } 50% { box-shadow: 0 0 62px rgba(57, 230, 255, 0.5), inset 0 0 32px rgba(57, 230, 255, 0.32); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes dash { to { stroke-dashoffset: -22; } }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="sigil"></div>
      <div>
        <h1>软件交付实时监控</h1>
        <div class="sub">多智能体编排 / 实时遥测</div>
      </div>
    </div>
    <div class="hud-right">
      <span id="clock">--:--:--</span>
      <span class="live" id="live"><span class="live-dot"></span><span id="live-text">连接中</span></span>
    </div>
  </header>

  <div class="layout">
    <aside class="panel">
      <div class="eyebrow">任务控制</div>
      <div class="chips">
        <div class="chip"><span class="k">模式</span><span class="v" id="mode">-</span></div>
        <div class="chip"><span class="k">阶段</span><span class="v" id="stage">-</span></div>
        <div class="chip"><span class="k">已通过的门</span><span class="v" id="gate">-</span></div>
        <div class="chip"><span class="k">事件更新</span><span class="v" id="updated">-</span></div>
      </div>
      <div class="gate-strip" id="gates"></div>
      <div class="stats">
        <div class="stat active"><div class="num" id="stat-active">0</div><div class="name">运行中</div></div>
        <div class="stat"><div class="num" id="stat-idle">0</div><div class="name">空闲</div></div>
        <div class="stat blocked"><div class="num" id="stat-blocked">0</div><div class="name">阻塞</div></div>
        <div class="stat handoffs"><div class="num" id="stat-handoffs">0</div><div class="name">累计交接</div></div>
      </div>
    </aside>

    <section class="panel stage" id="stage-panel">
      <div class="stage-head">
        <span>拓扑视图 / <span class="accent">实时</span></span>
        <span id="stage-code">节点总数 :: 12</span>
      </div>
      <svg class="links" id="links" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="0.7" result="blur"></feGaussianBlur>
            <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
          </filter>
        </defs>
        <g id="static-links"></g>
        <g id="flow-links"></g>
      </svg>
      <div id="nodes"></div>
      <div class="legend">
        <span><i></i>活跃流向</span>
        <span><i class="idle-line"></i>待命链路</span>
      </div>
    </section>

    <aside class="panel log-panel">
      <div class="eyebrow">实时流向</div>
      <div class="log" id="log"></div>
    </aside>
  </div>

  <footer>
    <span>事件源：docs/flow.json</span>
    <span id="refresh-rate">刷新频率：--</span>
    <span>状态源：docs/status.md</span>
  </footer>
</div>

<script>
let ORDER = [];
let NAMES = {};
let LABELS = {};
let GATE_NAMES = {};
let GATE_SHORT = {};
let STAGE_LABELS = {};
let REFRESH_MS = 1500;
const STATUS = { working: "运行", idle: "空闲", waiting: "等待", blocked: "阻塞" };
const FLOW_STATUS = { "in-review": "评审中", "done": "已完成" };

function stageName(value) {
  if (value === "INIT") return "初始化";
  return STAGE_LABELS[value] || GATE_NAMES[value] || value || "-";
}
const NODE_POS = {};

function layout() {
  Object.keys(NODE_POS).forEach(name => delete NODE_POS[name]);
  if (!ORDER.length) return;
  const others = ORDER.filter(name => name !== "orchestrator");
  others.forEach((name, index) => {
    const angle = (-90 + index * (360 / others.length)) * Math.PI / 180;
    NODE_POS[name] = { x: 50 + 37 * Math.cos(angle), y: 50 + 35 * Math.sin(angle) };
  });
  if (ORDER.includes("orchestrator")) {
    NODE_POS.orchestrator = { x: 50, y: 50 };
  }
}

function applyMeta(meta) {
  if (!meta || meta.error) return false;
  ORDER = (meta.agents || []).map(agent => agent.id);
  NAMES = {};
  LABELS = {};
  (meta.agents || []).forEach(agent => {
    NAMES[agent.id] = agent.title;
    LABELS[agent.id] = (agent.title || agent.id).slice(0, 2);
  });
  GATE_NAMES = {};
  GATE_SHORT = {};
  (meta.gates || []).forEach(gate => {
    GATE_NAMES[gate.id] = gate.name;
    GATE_SHORT[gate.id] = (gate.name || gate.id).slice(0, 2);
  });
  STAGE_LABELS = meta.stages || {};
  const seconds = Number((meta.monitoring || {}).refresh_seconds);
  if (seconds > 0) {
    REFRESH_MS = Math.max(200, seconds * 1000);
    document.getElementById("refresh-rate").textContent = "刷新频率：" + seconds + " 秒";
  }
  layout();
  return ORDER.length > 0;
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function renderGates(current, activeGates, passedGates) {
  const box = document.getElementById("gates");
  box.textContent = "";
  activeGates.forEach(gate => {
    const cls = "gate" + (passedGates.includes(gate) ? " past" : "") +
      (gate === current ? " on" : "");
    const item = el("span", cls, GATE_SHORT[gate] || gate);
    item.title = GATE_NAMES[gate] || gate;
    box.appendChild(item);
  });
}

function renderNodes(agents) {
  const box = document.getElementById("nodes");
  box.textContent = "";
  ORDER.forEach(name => {
    if (!agents[name]) return;
    const data = agents[name];
    const status = data.status || "idle";
    const node = el("div", "node " + status + (name === "orchestrator" ? " core" : ""));
    node.style.left = NODE_POS[name].x + "%";
    node.style.top = NODE_POS[name].y + "%";
    const disc = el("div", "disc");
    disc.appendChild(el("span", "glyph", LABELS[name] || name.slice(0, 3).toUpperCase()));
    disc.appendChild(el("span", "dot"));
    node.appendChild(disc);
    node.appendChild(el("div", "label", NAMES[name] || name));
    if (data.task && name !== "orchestrator") {
      node.appendChild(el("div", "task", data.task));
    }
    node.title = (NAMES[name] || name) + " / " + (STATUS[status] || status) + (data.task ? " / " + data.task : "");
    box.appendChild(node);
  });
}

function drawLinks(agents, flows) {
  const staticGroup = document.getElementById("static-links");
  const flowGroup = document.getElementById("flow-links");
  staticGroup.textContent = "";
  flowGroup.textContent = "";
  const center = NODE_POS.orchestrator;
  ORDER.forEach(name => {
    if (!agents[name] || name === "orchestrator") return;
    const target = NODE_POS[name];
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", center.x);
    line.setAttribute("y1", center.y);
    line.setAttribute("x2", target.x);
    line.setAttribute("y2", target.y);
    line.setAttribute("stroke", "rgba(57,230,255,0.13)");
    line.setAttribute("stroke-width", "0.25");
    line.setAttribute("vector-effect", "non-scaling-stroke");
    staticGroup.appendChild(line);
  });
  flows.slice(-6).forEach((flow, index) => {
    const from = NODE_POS[flow.from];
    const to = NODE_POS[flow.to];
    if (!from || !to) return;
    const mx = (from.x + to.x) / 2;
    const my = (from.y + to.y) / 2;
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const cx = mx - dy * 0.16;
    const cy = my + dx * 0.16;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M ${from.x} ${from.y} Q ${cx} ${cy} ${to.x} ${to.y}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", flow.status === "done" ? "#3bf5a0" : "#ffd34d");
    path.setAttribute("stroke-width", "0.42");
    path.setAttribute("stroke-dasharray", "1.4 1.6");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("vector-effect", "non-scaling-stroke");
    path.setAttribute("filter", "url(#glow)");
    path.setAttribute("opacity", index === flows.slice(-6).length - 1 ? "1" : "0.55");
    path.setAttribute("class", "flow-path");
    flowGroup.appendChild(path);
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("cx", to.x);
    dot.setAttribute("cy", to.y);
    dot.setAttribute("r", "0.7");
    dot.setAttribute("fill", flow.status === "done" ? "#3bf5a0" : "#ffd34d");
    dot.setAttribute("filter", "url(#glow)");
    flowGroup.appendChild(dot);
  });
}

function renderLog(flows, error) {
  const box = document.getElementById("log");
  box.textContent = "";
  if (error) {
    const warning = el("div", "empty events-error", error);
    warning.setAttribute("role", "status");
    box.appendChild(warning);
    return;
  }
  if (!flows.length) {
    const empty = el("div", "empty");
    empty.appendChild(document.createTextNode("暂无交接记录。"));
    empty.appendChild(document.createElement("br"));
    empty.appendChild(document.createTextNode("运行 "));
    empty.appendChild(el("code", "", "python tools/flow.py handoff ..."));
    empty.appendChild(document.createTextNode(" 后显示。"));
    box.appendChild(empty);
    return;
  }
  flows.slice(-10).reverse().forEach(flow => {
    const card = el("div", "flow");
    const top = el("div", "top");
    top.appendChild(el("span", "from", NAMES[flow.from] || flow.from || "?"));
    top.appendChild(el("span", "arrow", "→"));
    top.appendChild(el("span", "to", NAMES[flow.to] || flow.to || "?"));
    top.appendChild(el("span", "time", flow.time || ""));
    card.appendChild(top);
    const bottom = el("div", "bottom");
    if (flow.artifact) bottom.appendChild(el("span", "artifact", flow.artifact));
    const flowStatus = flow.status || "in-review";
    bottom.appendChild(el("span", "pill " + flowStatus, FLOW_STATUS[flowStatus] || flowStatus));
    if (flow.note) bottom.appendChild(el("span", "artifact", flow.note));
    card.appendChild(bottom);
    box.appendChild(card);
  });
}

function setLive(ok) {
  document.getElementById("live").classList.toggle("off", !ok);
  document.getElementById("live-text").textContent = ok ? "实时连接" : "连接中断";
}

function render(data) {
  if (data.error) {
    const box = document.getElementById("nodes");
    box.textContent = "";
    document.getElementById("log").textContent = "";
    const empty = el("div", "empty", data.hint || "无法读取流程状态。");
    empty.style.position = "absolute";
    empty.style.left = "50%";
    empty.style.top = "50%";
    empty.style.transform = "translate(-50%, -50%)";
    box.appendChild(empty);
    setLive(false);
    return;
  }
  document.getElementById("mode").textContent = data.mode || "未判定";
  document.getElementById("stage").textContent = stageName(data.stage);
  document.getElementById("gate").textContent = data.gate ?? "-";
  document.getElementById("updated").textContent = data.updated || "-";
  document.getElementById("stage-code").textContent = "节点总数 :: " + Object.keys(data.agents || {}).length;
  renderGates(data.stage, data.active_gates || [], data.passed_gates || []);
  const stats = data.stats || {};
  document.getElementById("stat-active").textContent = stats.active || 0;
  document.getElementById("stat-idle").textContent = stats.idle || 0;
  document.getElementById("stat-blocked").textContent = stats.blocked || 0;
  document.getElementById("stat-handoffs").textContent = stats.handoffs || 0;
  renderNodes(data.agents || {});
  drawLinks(data.agents || {}, data.flows || []);
  renderLog(data.flows || [], data.events_error);
  setLive(true);
}

async function refresh() {
  try {
    const response = await fetch("/api/state", { cache: "no-store" });
    const data = await response.json();
    render(data);
  } catch (error) {
    setLive(false);
  }
}

function tick() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("zh-CN", { hour12: false });
}

async function loadMeta() {
  try {
    const response = await fetch("/api/meta", { cache: "no-store" });
    const meta = await response.json();
    if (!applyMeta(meta)) throw new Error(meta.error || "meta");
    return true;
  } catch (error) {
    const box = document.getElementById("nodes");
    box.textContent = "";
    const empty = el("div", "empty", "无法读取 team.yaml。");
    empty.style.position = "absolute";
    empty.style.left = "50%";
    empty.style.top = "50%";
    empty.style.transform = "translate(-50%, -50%)";
    box.appendChild(empty);
    setLive(false);
    return false;
  }
}

async function init() {
  if (!await loadMeta()) return;
  await refresh();
  setInterval(refresh, REFRESH_MS);
}

tick();
setInterval(tick, 1000);
init();
</script>
</body>
</html>
